[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtrack-sdk"  # ✅ Hyphenated name for PyPI friendliness
version = "0.4.2"
description = "Middleware-based API analytics and observability tool for FastAPI and Django"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mahesh Solanke", email = "maheshsolanke69@gmail.com"}
]
urls = {Homepage = "https://github.com/mahesh-solanke/devtrack-sdk"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "rich>=13.3",
    "requests>=2.31",
    "typer>=0.9",
    "duckdb>=1.1.0"
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.90"
]
django = [
    "django>=4.0.0"
]
all = [
    "fastapi>=0.90",
    "django>=4.0.0"
]
dev = [
    "bump-my-version>=0.28",
    "django>=4.0.0",
    "fastapi>=0.90",
    "httpx>=0.24",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "tomli>=2.0; python_version < '3.11'",
    "uvicorn>=0.34"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["devtrack_sdk*"]

[tool.setuptools.package-data]
devtrack_sdk = [
    "dashboard/dist/**/*",
    "dashboard/index.html",
]

[project.scripts]
devtrack = "devtrack_sdk.cli:app"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", "venv", "__pycache__", "*.egg"]

[tool.bumpversion]
current_version = "0.4.2"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "setup.py"
search = 'version="{current_version}"'
replace = 'version="{new_version}"'

[[tool.bumpversion.files]]
filename = "devtrack_sdk/__version__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'version-{current_version}-blue.svg'
replace = 'version-{new_version}-blue.svg'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'current_version = "{current_version}"'
replace = 'current_version = "{new_version}"'
