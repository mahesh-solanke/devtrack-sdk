name: DevTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version:
          - "django>=4.2,<4.3"
          - "django>=5.2,<5.3"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "${{ matrix.django-version }}"
          pip install flake8

      - name: Run flake8
        run: flake8 .

      - name: Run tests
        run: PYTHONPATH=. pytest tests/
